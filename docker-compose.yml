services:
  # ── Admin layer (this repo) ─────────────────────────────────────────────
  # Administration ONLY: organization knowledge base, retrieval index, work-order
  # queue, review verdicts and profile contracts. Also projects the 31 marketing
  # profiles into ./data/hermes-home so the hermes-webui container can use them.
  valgist-admin:
    build: .
    image: valgist-admin:latest
    container_name: valgist-admin
    ports:
      # Published on localhost only by default — this dashboard can rewrite the
      # organization brain. To serve your LAN, set HERMES_ADMIN_BIND=0.0.0.0 in
      # .env AND set HERMES_ADMIN_TOKEN first.
      - "${HERMES_ADMIN_BIND:-127.0.0.1}:8321:8321"
    environment:
      - HERMES_PORT=8321
      - HERMES_WEBUI_URL=${HERMES_WEBUI_URL:-http://localhost:8787}
      - HERMES_MODEL=${HERMES_MODEL:-claude-opus-5}
      # Optional shared secret for the dashboard. It can write the organization
      # brain — set this before exposing the port beyond your own machine.
      - HERMES_ADMIN_TOKEN=${HERMES_ADMIN_TOKEN:-}
      # Scoped secret for the WebUI container: lets the Marketing Director's
      # promote-to-brain skill call POST /api/promote (and /api/activity) on the
      # admin server — nothing else. Only needed when HERMES_ADMIN_TOKEN is set.
      - HERMES_PROMOTE_TOKEN=${HERMES_PROMOTE_TOKEN:-}
      # Set to 1 to register the pre-publish compliance gate as a blocking hook
      # in every profile (see hermes/hooks/README.md). Off by default. Can also
      # be toggled live from the dashboard's Engine tab.
      - HERMES_ENFORCE_COMPLIANCE_HOOK=${HERMES_ENFORCE_COMPLIANCE_HOOK:-}
    volumes:
      # Long-term organization memory + engine data persist on the host
      - ./knowledge:/app/knowledge
      - ./data:/app/data
    restart: unless-stopped

  # ── Hermes WebUI (github.com/nesquena/hermes-webui) ─────────────────────
  # The engine's actual front end: chat with any of the 31 marketing
  # profiles via Hermes Agent. Its HERMES_HOME is ./data/hermes-home
  # (profiles generated by hermes-admin) and its workspace is ./knowledge —
  # the same organization knowledge base the admin dashboard manages.
  valgist-webui:
    build: ./hermes-webui
    image: valgist-webui:latest
    container_name: valgist-webui
    depends_on:
      - valgist-admin
    ports:
      # Published on localhost only by default. The WebUI holds provider API
      # keys and can edit workspace files — set HERMES_WEBUI_PASSWORD before
      # changing this to 0.0.0.0.
      - "${HERMES_WEBUI_BIND:-127.0.0.1}:8787:8787"
    environment:
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/workspace
      # Login password for the WebUI (empty = no login). Set it before exposing
      # the port beyond your own machine.
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-}
      # The profile homes are pre-provisioned by hermes-admin — never show the
      # first-run provider wizard, whose self-written config the sync preserves.
      - HERMES_WEBUI_SKIP_ONBOARDING=1
      # Where the Marketing Director's promote-to-brain skill reaches the admin
      # server (compose-internal hostname), and the scoped token it presents.
      - HERMES_ADMIN_URL=${HERMES_ADMIN_URL:-http://valgist-admin:8321}
      - HERMES_PROMOTE_TOKEN=${HERMES_PROMOTE_TOKEN:-}
      # Windows bind mounts don't support POSIX modes — skip the chmod fixer
      - HERMES_SKIP_CHMOD=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── Integration credentials ────────────────────────────────────────────
      # Declared by the profiles in hermes/integrations.json. NONE are wired in
      # the community edition: no connector code ships with this repo, so setting
      # one changes nothing on its own. They are passed through so that adding an
      # MCP server later is a config change, not a rebuild. Leave them empty.
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - GOOGLE_ADS_API_KEY=${GOOGLE_ADS_API_KEY:-}
      - BING_ADS_API_KEY=${BING_ADS_API_KEY:-}
      - META_ADS_TOKEN=${META_ADS_TOKEN:-}
      - LINKEDIN_ADS_TOKEN=${LINKEDIN_ADS_TOKEN:-}
      - TIKTOK_ADS_TOKEN=${TIKTOK_ADS_TOKEN:-}
      - AMAZON_ADS_API_KEY=${AMAZON_ADS_API_KEY:-}
      - CRM_API_KEY=${CRM_API_KEY:-}
      - ESP_API_KEY=${ESP_API_KEY:-}
      - N8N_API_URL=${N8N_API_URL:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY:-}
      - SEO_TOOL_API_KEY=${SEO_TOOL_API_KEY:-}
      - REVIEW_PLATFORM_API_KEY=${REVIEW_PLATFORM_API_KEY:-}
      - AB_TESTING_TOOL_API_KEY=${AB_TESTING_TOOL_API_KEY:-}
      - WEBINAR_PLATFORM_API_KEY=${WEBINAR_PLATFORM_API_KEY:-}
      - SOCIAL_SCHEDULER_API_KEY=${SOCIAL_SCHEDULER_API_KEY:-}
      - AFFILIATE_PLATFORM_API_KEY=${AFFILIATE_PLATFORM_API_KEY:-}
      - INTENT_DATA_API_KEY=${INTENT_DATA_API_KEY:-}
      - HOSTING_DEPLOY_TOKEN=${HOSTING_DEPLOY_TOKEN:-}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
    volumes:
      - ./data/hermes-home:/home/hermeswebui/.hermes
      - ./knowledge:/workspace
      # ── Organization brain: read-only in chat (hard, kernel-enforced) ───────
      # These four folders are the curated org brain. Every WebUI profile can
      # READ them, but NONE can write them from chat — the nested :ro bind mounts
      # override the writable ./knowledge:/workspace mount for just these subtrees.
      # Brain edits happen through the Admin Dashboard (:8321), which mounts
      # ./knowledge read-write (see hermes-admin above). Specialists whose normal
      # outputs would land here draft to 07-agent-outputs/ and hand off to the
      # Marketing Director, who promotes approved drafts via the dashboard.
      #
      # This list MUST match PROTECTED_DIRS in
      # hermes/scripts/protected-dirs.js — `npm run eval` checks it.
      - ./knowledge/00-org:/workspace/00-org:ro
      - ./knowledge/01-brand:/workspace/01-brand:ro
      - ./knowledge/02-market-research:/workspace/02-market-research:ro
      - ./knowledge/06-playbooks:/workspace/06-playbooks:ro
      # (INDEX.md is deliberately NOT mounted :ro — it is git-ignored and
      # generated at boot, so a bind mount on a fresh clone would materialize
      # as an empty directory. Tampering self-heals: the admin server rewrites
      # it on every knowledge change and every telemetry sweep.)
    # Write-probe: every SOUL promises "a write to the brain fails at the
    # filesystem level". Verify the promise instead of trusting the mount list —
    # if any brain dir is writable from inside the container, go unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "for d in 00-org 01-brand 02-market-research 06-playbooks; do if touch /workspace/$$d/.rw-probe 2>/dev/null; then rm -f /workspace/$$d/.rw-probe; exit 1; fi; done; exit 0"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30s
    restart: unless-stopped
