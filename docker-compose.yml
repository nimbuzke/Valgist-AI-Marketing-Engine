services:
  # ── Admin layer (this repo) ─────────────────────────────────────────────
  # Administration ONLY: organization knowledge base, critical outputs and
  # profile contracts. Also projects the 31 marketing profiles into
  # ./data/hermes-home so the hermes-webui container can use them.
  hermes-admin:
    build: .
    image: hermes-marketing-admin:latest
    container_name: hermes-admin
    ports:
      - "8321:8321"
    environment:
      - HERMES_PORT=8321
      - HERMES_WEBUI_URL=${HERMES_WEBUI_URL:-http://localhost:8787}
      - HERMES_MODEL=${HERMES_MODEL:-claude-opus-4-8}
    volumes:
      # Long-term organization memory + engine data persist on the host
      - ./knowledge:/app/knowledge
      - ./data:/app/data
    restart: unless-stopped

  # ── Hermes WebUI (github.com/nesquena/hermes-webui) ─────────────────────
  # The engine's actual front end: chat with any of the 31 marketing
  # profiles via Hermes Agent. Its HERMES_HOME is ./data/hermes-home
  # (profiles generated by hermes-admin) and its workspace is ./knowledge —
  # the same organization knowledge base the admin dashboard manages.
  hermes-webui:
    build: ./hermes-webui
    image: hermes-marketing-webui:latest
    container_name: hermes-webui
    depends_on:
      - hermes-admin
    ports:
      - "8787:8787"
    environment:
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/workspace
      # Windows bind mounts don't support POSIX modes — skip the chmod fixer
      - HERMES_SKIP_CHMOD=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data/hermes-home:/home/hermeswebui/.hermes
      - ./knowledge:/workspace
    restart: unless-stopped
