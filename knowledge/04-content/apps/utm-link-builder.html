<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTM Link Builder</title>
<meta name="description" content="Build consistent UTM-tagged campaign URLs and copy them with one click. Ships as the example mini-app.">
<meta name="valgist-profile" content="analytics-engine">
<style>
  :root{--bg:#12151d;--card:#1b202c;--line:#2c3446;--fg:#e8ecf5;--muted:#8b96ad;--accent:#5fa8f5}
  *{box-sizing:border-box;margin:0}
  body{font:15px/1.55 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);
    display:flex;justify-content:center;padding:28px 16px;min-height:100vh}
  main{width:min(640px,100%)}
  h1{font-size:1.25rem;margin-bottom:4px}
  p.sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;
    display:grid;gap:12px}
  label{font-size:.78rem;color:var(--muted);display:grid;gap:4px}
  input,select{padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
    color:var(--fg);font-size:.9rem;outline:none;width:100%}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  output{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-top:14px;font-family:ui-monospace,Consolas,monospace;font-size:.83rem;
    word-break:break-all;min-height:54px;color:var(--accent)}
  .bar{display:flex;gap:8px;margin-top:10px}
  button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--fg);font-size:.85rem;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:600}
  button:hover{filter:brightness(1.12)}
  .ok{color:#4fc98c;font-size:.8rem;align-self:center}
</style>
</head>
<body>
<main>
  <h1>🔗 UTM Link Builder</h1>
  <p class="sub">Consistent campaign tagging — lowercase, kebab-case, no stray spaces.</p>
  <form id="f">
    <label>Landing page URL
      <input id="url" type="url" placeholder="https://example.com/pricing" required>
    </label>
    <div class="row">
      <label>Source (utm_source)
        <input id="source" placeholder="newsletter, google, linkedin" required>
      </label>
      <label>Medium (utm_medium)
        <select id="medium">
          <option value="email">email</option><option value="cpc">cpc</option>
          <option value="social">social</option><option value="organic-social">organic-social</option>
          <option value="referral">referral</option><option value="display">display</option>
          <option value="affiliate">affiliate</option><option value="qr">qr</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Campaign (utm_campaign)
        <input id="campaign" placeholder="q3-launch" required>
      </label>
      <label>Content — optional (utm_content)
        <input id="content" placeholder="hero-cta, footer-link">
      </label>
    </div>
  </form>
  <output id="out">Fill the form — the tagged URL appears here.</output>
  <div class="bar">
    <button class="primary" id="copy" type="button">Copy URL</button>
    <span class="ok" id="msg"></span>
  </div>
</main>
<script>
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var slug = function (s) {
    return s.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  };
  function build() {
    var base = $("url").value.trim();
    if (!base || !$("source").value.trim() || !$("campaign").value.trim()) {
      $("out").textContent = "Fill the form — the tagged URL appears here.";
      return "";
    }
    try {
      var u = new URL(base);
      u.searchParams.set("utm_source", slug($("source").value));
      u.searchParams.set("utm_medium", $("medium").value);
      u.searchParams.set("utm_campaign", slug($("campaign").value));
      var c = slug($("content").value);
      if (c) u.searchParams.set("utm_content", c); else u.searchParams.delete("utm_content");
      $("out").textContent = u.href;
      return u.href;
    } catch (e) {
      $("out").textContent = "That URL doesn't parse yet — include the https:// part.";
      return "";
    }
  }
  document.querySelectorAll("input,select").forEach(function (el) {
    el.addEventListener("input", build);
  });
  $("copy").addEventListener("click", function () {
    var href = build();
    if (!href) return;
    var done = function () { $("msg").textContent = "Copied ✓"; setTimeout(function () { $("msg").textContent = ""; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(href).then(done, function () { $("msg").textContent = href; });
    } else {
      $("msg").textContent = "Select the URL above and copy it.";
    }
  });
</script>
</body>
</html>
